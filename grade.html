<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fortran 作業評分系統</title><style>body{font-family:system-ui,'Noto Sans TC',sans-serif;background:#f4f6fa;color:#182338;margin:0;padding:30px}main{max-width:760px;margin:auto;background:white;border-radius:18px;padding:30px;box-shadow:0 8px 28px #18233816}h1{margin-top:0}label{display:block;margin:18px 0 8px;font-weight:600}input,select,textarea{box-sizing:border-box;width:100%;padding:12px;border:1px solid #c9d1df;border-radius:9px;font:inherit}textarea{min-height:85px}.task{padding:14px 0;border-bottom:1px solid #e4e8f0}button{border:0;border-radius:9px;background:#2159c7;color:white;padding:13px 20px;margin-top:22px;cursor:pointer;font:inherit}.result{background:#eef3ff;border-radius:12px;padding:18px;margin-top:20px;font-size:1.15rem}small{color:#596579}</style></head><body><main><h1>Fortran 作業評分系統</h1><p>輸入姓名、學號與前四題完成情形，每題 20 分。第五題為評分系統功能，完成可得 20 分。</p><label for="name">姓名</label><input id="name" placeholder="請輸入姓名"><label for="student">學號</label><input id="student" placeholder="請輸入學號"><div id="tasks"></div><label for="notes">補充說明／證據連結</label><textarea id="notes" placeholder="GitHub 網址、編譯與測試紀錄等"></textarea><button id="calculate">計算總分</button> <button id="print" type="button">列印成績</button><div class="result" id="result" aria-live="polite">尚未評分</div><small>評分依填寫內容計算；請由授課教師核實實際完成情形。</small></main><script>const labels=['一、Fortran 程式編譯與執行','二、三次隨機測試','三、Git 兩次 Commit 與註解驗證','四、GitHub 雲端上傳'];const tasks=document.getElementById('tasks');labels.forEach((t,i)=>{let d=document.createElement('div');d.className='task';let l=document.createElement('label');l.textContent=t;l.htmlFor='t'+i;let s=document.createElement('select');s.id='t'+i;[['0','未完成（0 分）'],['20','已完成並有證據（20 分）']].forEach(([v,txt])=>{let o=document.createElement('option');o.value=v;o.textContent=txt;s.append(o)});d.append(l,s);tasks.append(d)});document.getElementById('calculate').onclick=()=>{const name=document.getElementById('name').value.trim()||'未填';const id=document.getElementById('student').value.trim()||'未填';const points=labels.map((_,i)=>Number(document.getElementById('t'+i).value));const total=points.reduce((a,b)=>a+b,20);document.getElementById('result').textContent=`姓名：${name}｜學號：${id}｜前四題：${points.join(' + ')}｜第五題：20｜總分：${total} / 100 分（自評，待教師核實）`};document.getElementById('print').onclick=()=>window.print();</script></body></html>
